<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的单词书</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="page-bg">

  <a class="back-link" href="index.html">← 返回主页</a>

  <main class="panel">
  <h1>我的词库</h1>
  <div id="tip">初始化中...</div>

  <div class="input-row">
    <input id="eng" type="text" placeholder="ENG 英文">
    <input id="chi" type="text" placeholder="CHI 中文释义">
    <button id="btnAdd" class="btn-add">插入</button>
    <button id="btnRefresh" class="btn-normal">刷新列表</button>
    <button id="btnExport" class="btn-normal">导出数据</button>
    
    <!-- 使用 label 包裹隐藏的 input，增加点击体验 -->
    <label class="btn-normal" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; background: #f8f9fa;">
      导入数据
      <input type="file" id="btnImport" accept=".json" style="display: none;">
    </label>
  </div>

  <div id="list"></div>
  </main>

  <script src="js/db.js"></script>
  <script>
    let editingId = null;   // 正在编辑的行 ID
    const tipDom = document.getElementById('tip');
    const listDom = document.getElementById('list');

    // ===== 初始化 =====
    (async function init(){
      try {
        await AppDB.init(); // 内部只是简单检查一下 localStorage
        tipDom.innerText = '初始化成功，数据已保存在本地';
        renderTable();
      } catch (e) {
        tipDom.innerText = '初始化失败：' + e.message;
        tipDom.classList.add('tip-error');
        console.error(e);
      }
    })();

    // ===== 新增 =====
    document.getElementById('btnAdd').onclick = () => {
      const engVal = document.getElementById('eng').value.trim();
      const chiVal = document.getElementById('chi').value.trim();
      if (!engVal || !chiVal) return;
      
      // 直接调用封装好的同步方法
      AppDB.add(engVal, chiVal);
      
      // 清空输入框
      document.getElementById('eng').value = '';
      document.getElementById('chi').value = '';
      
      renderTable();
    };

    // ===== 删除（先确认） =====
    window.delRow = function (id) {
      if (!confirm('确定删除这条单词吗？')) return;
      
      AppDB.del(id);
      if (editingId === id) editingId = null;
      renderTable();
    };

    // ===== 编辑态 =====
    window.startEdit = function (id) {
      editingId = id;
      renderTable();
    };

    window.cancelEdit = function () {
      editingId = null;
      renderTable();
    };

    // 保存编辑
    window.saveEdit = function (id) {
      const engInput = document.getElementById('eng-input-' + id);
      const chiInput = document.getElementById('chi-input-' + id);
      const engVal = engInput.value.trim();
      const chiVal = chiInput.value.trim();
      if (!engVal || !chiVal) {
        alert('英文和中文都不能为空');
        return;
      }
      
      AppDB.update(id, engVal, chiVal);
      editingId = null;
      renderTable();
      tipDom.innerText = '已保存修改';
    };

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ===== 渲染（已适配 localStorage 对象数组） =====
    function renderTable() {
      // 获取本地数据并按 ID 排序
      const rows = AppDB.getAll().sort((a, b) => a.id - b.id);
      
      if (!rows || rows.length === 0) {
        listDom.innerHTML = '<p>暂无单词数据</p>';
        return;
      }

      let html = `<table>
        <colgroup>
          <col style="width:7%"><col style="width:27%"><col style="width:27%">
          <col style="width:10%"><col style="width:14%"><col style="width:15%">
        </colgroup>
        <tr>
          <th>ID</th><th>ENG</th><th>CHI</th><th>STUDY_TIME</th><th>CREATE_TIME</th><th>操作</th>
        </tr>`;
        
      rows.forEach(r => {
        // 适配我们自定义的小写字段名
        const id = r.id;
        const eng = r.eng;
        const chi = r.chi;
        const studyTime = r.studyTime;
        const createTime = r.createTime;
        const isEditing = editingId === id;

        const engCell = isEditing
          ? `<input class="cell-input" id="eng-input-${id}" type="text" value="${escapeHtml(eng)}">`
          : escapeHtml(eng);
        const chiCell = isEditing
          ? `<input class="cell-input" id="chi-input-${id}" type="text" value="${escapeHtml(chi)}">`
          : escapeHtml(chi);

        const actCell = isEditing
          ? `<div class="act-row">
               <button class="btn-save" onclick="saveEdit(${id})">保存</button>
               <button class="btn-edit" onclick="cancelEdit()">取消</button>
             </div>`
          : `<div class="act-row">
               <button class="btn-edit" onclick="startEdit(${id})">编辑</button>
               <button class="btn-del" onclick="delRow(${id})">删除</button>
             </div>`;

        html += `<tr>
          <td>${id}</td><td>${engCell}</td><td>${chiCell}</td>
          <td>${studyTime}</td><td>${createTime}</td><td>${actCell}</td>
        </tr>`;
      });
      html += '</table>';
      listDom.innerHTML = html;
    }

    document.getElementById('btnRefresh').onclick = renderTable;

    // ===== 导出 JSON =====
    document.getElementById('btnExport').onclick = () => {
      try {
        tipDom.innerText = '正在导出...';
        const dataStr = AppDB.exportJSON(); // 返回的是纯 JSON 字符串
        const blob = new Blob([dataStr], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vocab_backup.json';
        a.click();
        URL.revokeObjectURL(a.href);
        tipDom.innerText = '导出成功';
      } catch (err) {
        tipDom.innerText = '导出失败：' + err.message;
      }
    };

    // ===== 导入 JSON 并合并 =====
    document.getElementById('btnImport').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      tipDom.innerText = '导入合并中...';
      
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          // 直接解析文本并合并
          const result = AppDB.importJSON(event.target.result);
          renderTable();
          tipDom.innerText = `合并完成：新增${result.insertCount}条，更新${result.updateCount}条`;
        } catch (err) {
          tipDom.innerText = '导入失败：' + err.message;
          tipDom.classList.add('tip-error');
          console.error(err);
        }
      };
      reader.readAsText(file);
      e.target.value = '';  // 允许重复选择同一个文件
    };
  </script>
</body>
</html>
